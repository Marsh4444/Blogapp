<!-- Header Part-->
 {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blo.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-4 pt-1">
            <a class="blog-header-logo text-dark" href="/">Django Blog</a>
          </div>

          <!-- Search -->
    <div class="col-4 d-flex justify-content-end">
      <form method="GET" action="{% url 'search' %}">
        <div class="input-group">
          <input 
            type="text" 
            name="keyword" 
            value="{{ keyword}}"
            class="form-control"
            placeholder="Search posts..."
            aria-label="Search posts"
            required
          >
          <button type="submit" type="button" class="btn btn-warning"  id="button-search">Go!</button>
        </div>
      </form>
    </div>

    <div class="col-4 d-flex justify-content-end align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="mr-2 font-weight-bold" ><a class="text-dark" href="{% url 'dashboard' %}">Dashboard</a></span>
        <a class="btn btn-sm btn-danger" href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a class="btn btn-sm btn-warning mr-1" href="{% url 'login' %}">Login</a> 
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>

      </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for categorie in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_category' categorie.pk %}">{{categorie}}</a>          
          {% endfor %}
        </nav>
      </div><hr style="padding: 0px;">
       


<!-- MAin Content Part-->
{% block content %} 

{% endblock %}



<!-- Footer Part -->
<footer class="blog-footer">
  <p>Django blog built with ❤️ by <a href="#">Nwadike Holyfield</a></p>
</footer>
</body>
</html>
