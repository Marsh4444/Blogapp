{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!--Left Sidebar -->
    {% include 'dashboards/sidebar.html' %}



    <!--right Sidebar -->
    <div class="col-md-9">
        <span>Logged in as: <b>{{ user.username }}</b></span>
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">Total Categories: {{ category_count }}</h5>
                    </div>
                    
                </div>
            </div>

            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">All Posts</div>
                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">Total Posts: {{ blogs_count }}</h5>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
